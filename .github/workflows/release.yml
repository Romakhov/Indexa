# Release: push a tag equal to manifest.json's version (e.g. 0.0.1). Obsidian's
# action builds main.js, runs the full release-mode checks (scanner lint, bundle
# preflight, manifest vs tag), attests the build artifacts and creates a DRAFT
# release with main.js, manifest.json and styles.css. Publish the draft by hand.
name: Release
on:
  push:
    tags: ["*"]
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: obsidianmd/obsidian-workflows@8167caed39664214d82c86fdfa32e06d8d55f61d # v1.2.3
        with:
          type: plugin
          mode: release
          build: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # release notes: the CHANGELOG.md section of this version
      - name: Release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk -v v="## ${GITHUB_REF_NAME}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME}"; exit 1; }
          gh release edit "${GITHUB_REF_NAME}" --notes-file notes.md
