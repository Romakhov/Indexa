# Obsidian's own review checks (the community directory scans every release with
# these rules). Runs on every push so scanner findings surface during development,
# not at release time.
name: Obsidian review checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - uses: obsidianmd/obsidian-workflows@8167caed39664214d82c86fdfa32e06d8d55f61d # v1.2.3
        with:
          type: plugin
          mode: pr
          build: "false"
          scanner-lint: "true"
